# The single-host installation, installed as its README says on a fresh Ubuntu machine, a first
# workflow run on it, then the installation stopped, started, backed up and removed. The commands
# are the README's own: every fenced block that follows a <!-- ci --> line, run in order in one
# shell, so the guide and the test cannot drift apart.
name: single-host

on:
  push:
    branches: [main, single-host]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: single-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Lint
        run: |
          shellcheck single-host/setup
          cp single-host/.env.example single-host/.env
          echo DOCKER_GID=0 >> single-host/.env
          docker compose -f single-host/compose.yaml config --quiet
          docker compose -f single-host/compose.yaml -f single-host/compose.build.yaml config --quiet
          rm single-host/.env

      # What a person following the README already has: a git identity to commit the workflow with.
      - name: Git identity
        run: |
          git config --global user.name "Single-host test"
          git config --global user.email "single-host@agentiik.invalid"

      # The README names the version .env.example pins. Until its images are on ghcr.io and its tag
      # exists, the test builds them from the source of main instead, through the README's own
      # optional override, and installs agk from main: the one variable a user may change, changed
      # here and nowhere else. Once the version is published this step changes nothing, and the
      # README runs verbatim.
      - name: Choose what to install
        working-directory: single-host
        run: |
          version=$(sed -n 's/^AGENTIIK_VERSION=//p' .env.example)
          if docker manifest inspect "ghcr.io/agentiik/api:$version" >/dev/null 2>&1 &&
             git ls-remote --exit-code --tags https://github.com/agentiik/agentiik.git "refs/tags/$version" >/dev/null; then
            echo "Installing $version as published"
            echo "PUBLISHED=$version" >> "$GITHUB_ENV"
          else
            echo "$version is not published yet: building main from source"
            sed -i "s/^AGENTIIK_VERSION=.*/AGENTIIK_VERSION=main/; s/^#COMPOSE_FILE=/COMPOSE_FILE=/" .env.example
            echo "UNPUBLISHED=$version" >> "$GITHUB_ENV"
          fi

      - name: Extract the README's commands
        run: |
          awk '
            /^<!-- ci -->$/ { take = 1; next }
            take && /^```/ { if (inside) { inside = 0; take = 0; print "" } else { inside = 1 }; next }
            inside { print }
          ' single-host/README.md > "$RUNNER_TEMP/readme.sh"
          if [ -n "${UNPUBLISHED:-}" ]; then
            sed -i "s|cmd/agk@$UNPUBLISHED|cmd/agk@main|" "$RUNNER_TEMP/readme.sh"
          fi
          cat "$RUNNER_TEMP/readme.sh"

      # -v prints each line as it is read, before expansion, so the operator token is never shown.
      - name: Run the README
        working-directory: single-host
        run: bash -veuo pipefail "$RUNNER_TEMP/readme.sh"

      - name: Logs of what failed
        if: failure()
        working-directory: single-host
        run: |
          sudo docker compose ps --all || true
          sudo docker compose logs --no-color --tail 200 || true
