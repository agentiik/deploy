# The single-host installation, installed as its README says on a fresh Ubuntu machine, a first
# workflow run on it, a setting changed, a runner added on a second machine, then the installation
# backed up and removed. The commands are the README's own: every fenced block that follows a
# <!-- ci --> line, run in order in one shell, so the guide and the test cannot drift apart. It runs
# three ways: with compose.yaml alone and no .env, with a .env, and behind Caddy. A block marked
# <!-- ci: MODE ... --> runs in the modes it names, one marked <!-- ci: other machine --> runs on the
# second machine, and <!-- ci: check NAME --> sources .github/single-host/NAME.sh at that point.
name: single-host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: single-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [none, direct, proxy]
    name: readme (${{ matrix.mode }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      # Each Compose file as Compose reads it: alone, with its .env.example as .env, and behind a
      # proxy. The runner's has no default for the installation's address, and says so.
      - name: Lint
        run: |
          shellcheck .github/single-host/*.sh
          (cd single-host && docker compose config --quiet)
          (cd single-host && AGENTIIK_PROXY_URL=https://agentiik.example.com docker compose config --quiet)
          (cd single-host && cp .env.example .env && docker compose config --quiet && rm .env)
          (cd runner && ! docker compose config --quiet 2>/dev/null)
          (cd runner && cp .env.example .env && docker compose config --quiet && rm .env)

      # What a person following the README already has: a git identity to commit the workflow with.
      - name: Git identity
        run: |
          git config --global user.name "Single-host test"
          git config --global user.email "single-host@agentiik.invalid"

      # compose.yaml's default version is the release this README describes. Until its images are
      # on ghcr.io and its tag exists, the test runs the images of main instead, tagged dev, by
      # setting AGENTIIK_VERSION in the environment, which Compose reads before .env and the file's
      # defaults, and installs agk from main: the one variable a user may change, changed here and
      # nowhere else. Once the version is published this step changes nothing.
      - name: Choose what to install
        run: |
          version=$(sed -n 's/.*AGENTIIK_VERSION:-\([^}]*\)}.*/\1/p' single-host/compose.yaml | head -n 1)
          if docker manifest inspect "ghcr.io/agentiik/api:$version" >/dev/null 2>&1 &&
             git ls-remote --exit-code --tags https://github.com/agentiik/agentiik.git "refs/tags/$version" >/dev/null; then
            echo "Installing $version as published"
          else
            echo "$version is not published yet: installing the dev images of main"
            echo "AGENTIIK_VERSION=dev" >> "$GITHUB_ENV"
            echo "UNPUBLISHED=$version" >> "$GITHUB_ENV"
          fi

      # A runner reaches the installation at AGENTIIK_HOST, which a user sets to the name other
      # machines reach: here the address of this machine's network interface, which the second
      # machine reaches and which is not the loopback. Behind the proxy, the README's
      # agentiik.example.com is that address too, which Caddy serves with a certificate from its own
      # authority, as it does for any IP address. With no .env, the host is localhost, which no
      # other machine reaches, so that mode adds no runner elsewhere.
      - name: Name the installation
        run: |
          host_ip=$(hostname -I | awk '{ print $1 }')
          echo "HOST_IP=$host_ip" >> "$GITHUB_ENV"
          if [ "${{ matrix.mode }}" = proxy ]; then
            echo "REMOTE_SERVER=https://$host_ip" >> "$GITHUB_ENV"
          else
            echo "REMOTE_SERVER=https://$host_ip:8443" >> "$GITHUB_ENV"
          fi

      # The other machine of "Add a runner on another machine": a Docker daemon of its own, in a
      # container on the default bridge, which reaches this machine's address and not its loopback.
      # It has what the README asks of a Linux machine, and this checkout at the same path, where the
      # README's downloads are read from.
      - name: Start another machine
        if: matrix.mode != 'none'
        run: |
          docker run --detach --privileged --name machine2 docker:29-dind
          for _ in $(seq 60); do docker exec machine2 docker version >/dev/null 2>&1 && break; sleep 1; done
          docker exec machine2 apk add --no-cache --quiet bash sudo coreutils curl
          docker exec machine2 docker compose version
          docker exec machine2 mkdir -p "$GITHUB_WORKSPACE" /root/agentiik-runner
          docker cp "$GITHUB_WORKSPACE/." "machine2:$GITHUB_WORKSPACE"

      - name: Extract the README's commands
        env:
          MODE: ${{ matrix.mode }}
        run: |
          # A block for the other machine runs there, after what the README has the user carry
          # over by hand: the certificates in trust/, the address and the join token.
          awk -v mode="$MODE" '
            /^<!-- ci -->$/ { take = 1; next }
            /^<!-- ci: other machine -->$/ { take = (mode != "none"); other = 1; next }
            /^<!-- ci: check [a-z-]+ -->$/ {
              print ". \"$GITHUB_WORKSPACE/.github/single-host/" $4 ".sh\""
              next
            }
            /^<!-- ci: [a-z ]+ -->$/ { take = index($0, " " mode " ") > 0; next }
            /^```/ && (take || inside) {
              if (!inside) {
                inside = 1
                if (other) {
                  print "for pem in trust/*.pem; do docker cp \"$pem\" machine2:/root/agentiik-runner/; done"
                  print "docker exec -i -e JOIN_TOKEN=\"$JOIN_TOKEN\" -e AGENTIIK_SERVER=\"$REMOTE_SERVER\" ${AGENTIIK_VERSION:+-e AGENTIIK_VERSION=\"$AGENTIIK_VERSION\"} -w /root/agentiik-runner machine2 bash -veuo pipefail <<'\''OTHER_MACHINE'\''"
                }
              } else {
                if (other) print "OTHER_MACHINE"
                inside = 0; take = 0; other = 0; print ""
              }
              next
            }
            /^```/ { other = 0 }
            inside { print }
          ' single-host/README.md > "$RUNNER_TEMP/readme.sh"
          # The README downloads each file from its release tag; the test reads them from this
          # checkout instead, which is what that tag will hold.
          sed -i "s|https://raw\.githubusercontent\.com/agentiik/deploy/[^/]*/|file://$GITHUB_WORKSPACE/|g" "$RUNNER_TEMP/readme.sh"
          if [ -n "${UNPUBLISHED:-}" ]; then
            sed -i "s|cmd/agk@$UNPUBLISHED|cmd/agk@main|" "$RUNNER_TEMP/readme.sh"
          fi
          # The name a user gives the installation, here the address this machine and the other one reach.
          sed -i "s|agentiik\.example\.com|$HOST_IP|g" "$RUNNER_TEMP/readme.sh"
          cat "$RUNNER_TEMP/readme.sh"
          # As a person pastes it: a cd that fails, a file sourced from elsewhere and an export of
          # a command's output are the README's idiom, and set -e stops the run on either first.
          shellcheck --shell=bash --exclude=SC2164,SC1091,SC2155 "$RUNNER_TEMP/readme.sh"

      # -v prints each line as it is read, before expansion, so a token set in .env is never shown.
      # One init mints is printed by docker compose logs init, as the README says; this installation
      # is reached by nothing outside this machine, and is removed before the job ends.
      - name: Run the README
        run: cd ~ && bash -veuo pipefail "$RUNNER_TEMP/readme.sh"

      - name: Logs of what failed
        if: failure()
        run: |
          docker compose -p agentiik ps --all || true
          docker compose -p agentiik logs --no-color --tail 200 || true
          docker exec machine2 docker compose -p agentiik-runner logs --no-color --tail 200 || true
          docker logs caddy || true

  # Each file in single-host/proxy/, run as its comments say in front of a stand-in for the API,
  # which checks what the API asks of a proxy: %2F passed undecoded, a log stream not buffered, and
  # an upload over nginx's default size. The README job runs Caddy in front of the real API.
  proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start the stand-in for the API
        run: |
          python3 .github/proxy/backend.py serve > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8443/ >/dev/null && break; sleep 1; done

      # Where each proxy's file names agentiik.example.com and the certificate a user obtains, the
      # test gives localhost and a certificate it makes; nothing else of each file changes.
      - name: Make a certificate for localhost
        run: |
          mkdir -p "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost -keyout "$RUNNER_TEMP/certs/privkey.pem" -out "$RUNNER_TEMP/certs/fullchain.pem" 2>/dev/null

      - name: Caddy
        run: |
          docker run --detach --name proxy --network host -e AGENTIIK_PROXY_URL=https://localhost \
            -v "$PWD/single-host/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2
          for _ in $(seq 30); do curl -ksf https://localhost/ >/dev/null && break; sleep 1; done
          python3 .github/proxy/backend.py check https://localhost
          docker rm --force proxy

      - name: nginx
        run: |
          sed 's|agentiik\.example\.com|localhost|g; s|/etc/letsencrypt/live/localhost/|/certs/|' single-host/proxy/nginx.conf > "$RUNNER_TEMP/nginx.conf"
          docker run --detach --name proxy --network host -v "$RUNNER_TEMP/certs:/certs:ro" \
            -v "$RUNNER_TEMP/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable
          for _ in $(seq 30); do curl -ksf https://localhost/ >/dev/null && break; sleep 1; done
          python3 .github/proxy/backend.py check https://localhost
          docker rm --force proxy

      - name: Traefik
        run: |
          mkdir -p "$RUNNER_TEMP/traefik"
          cp single-host/proxy/traefik.yaml "$RUNNER_TEMP/traefik/traefik.yaml"
          sed 's|agentiik\.example\.com|localhost|g; s|certResolver: letsencrypt|options: default|' single-host/proxy/traefik-agentiik.yaml > "$RUNNER_TEMP/traefik/traefik-agentiik.yaml"
          docker run --detach --name proxy --network host -v "$RUNNER_TEMP/traefik:/etc/traefik" traefik:v3
          for _ in $(seq 30); do curl -ksf https://localhost/ >/dev/null && break; sleep 1; done
          python3 .github/proxy/backend.py check https://localhost
          docker rm --force proxy

      - name: Logs of what failed
        if: failure()
        run: |
          docker logs proxy || true
          cat "$RUNNER_TEMP/backend.log" || true
