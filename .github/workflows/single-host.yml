# The single-host installation, installed as its README says on a fresh Ubuntu machine, its first
# administrator created, a first workflow run on it, a setting changed, a runner added on a second
# machine, then the installation backed up and removed. The commands are the README's own: every
# fenced block that follows a <!-- ci --> line, run in order in one shell, so the guide and the test
# cannot drift apart. It runs three ways: as the README's Start (none), on a server (direct), and
# behind Caddy (proxy). A block marked <!-- ci: MODE ... --> runs in the modes it names, one marked
# <!-- ci: other machine --> runs on the second machine, and <!-- ci: check NAME --> sources
# .github/single-host/NAME.sh at that point. One marked <!-- ci: browser --> runs nowhere: it signs
# the first administrator in, after a browser has registered their passkey, which the test cannot
# do, so the bootstrap token never ends here and the rest of the README runs with it.
name: single-host

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: single-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [none, direct, proxy]
    name: readme (${{ matrix.mode }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      # Each Compose file as Compose reads it: alone, with its .env.example as .env, and behind a
      # proxy. Neither has a default for what only its user can give, the operator token and the
      # installation's address, and each says so; .env.example leaves the token for the user to fill.
      - name: Lint
        run: |
          shellcheck .github/single-host/*.sh
          token=$(openssl rand -hex 32)
          (cd single-host && if docker compose config --quiet 2>"$RUNNER_TEMP/err"; then exit 1; fi; grep 'set AGENTIIK_OPERATOR_TOKEN in .env' "$RUNNER_TEMP/err")
          (cd single-host && AGENTIIK_OPERATOR_TOKEN=$token docker compose config --quiet)
          (cd single-host && AGENTIIK_OPERATOR_TOKEN=$token AGENTIIK_PROXY_URL=https://agentiik.example.com docker compose config --quiet)
          # postgres-upgrade upgrades to the major version the postgres image runs, named twice in the file.
          (cd single-host && AGENTIIK_OPERATOR_TOKEN=$token docker compose config --format json |
            jq -e '(.services.postgres.image | capture("^postgres:(?<major>[0-9]+)-").major) == .services["postgres-upgrade"].command[1]')
          (cd single-host && cp .env.example .env && ! docker compose config --quiet 2>/dev/null)
          (cd single-host && sed -i "s/^AGENTIIK_OPERATOR_TOKEN=\$/AGENTIIK_OPERATOR_TOKEN=$token/" .env && docker compose config --quiet && rm .env)
          (cd runner && ! docker compose config --quiet 2>/dev/null)
          (cd runner && cp .env.example .env && docker compose config --quiet && rm .env)

      # What a person following the README already has: a git identity to commit the workflow with.
      - name: Git identity
        run: |
          git config --global user.name "Single-host test"
          git config --global user.email "single-host@agentiik.invalid"

      # compose.yaml's default version is the release this README describes. Until its images are
      # on ghcr.io and its tag exists, the test runs the images of main instead, tagged dev, by
      # setting AGENTIIK_VERSION in the environment, which Compose reads before .env and the file's
      # defaults, and installs agk from main: the one variable a user may change, changed here and
      # nowhere else. Once the version is published this step changes nothing.
      - name: Choose what to install
        run: |
          . .github/single-host/published.sh
          version=$(default_version single-host/compose.yaml)
          if published "$version"; then
            echo "Installing $version as published"
          else
            echo "$version is not published yet: installing the dev images of main"
            echo "AGENTIIK_VERSION=dev" >> "$GITHUB_ENV"
            echo "UNPUBLISHED=$version" >> "$GITHUB_ENV"
          fi

      # A runner reaches the installation at AGENTIIK_HOST, which a user sets to the name other
      # machines reach: here the address of this machine's network interface, which the second
      # machine reaches and which is not the loopback. Behind the proxy, the README's
      # agentiik.example.com is that address too, which Caddy serves with a certificate from its own
      # authority, as it does for any IP address. As in the README's Start, the host is localhost,
      # which no other machine reaches, so that mode adds no runner elsewhere.
      - name: Name the installation
        run: |
          host_ip=$(hostname -I | awk '{ print $1 }')
          echo "HOST_IP=$host_ip" >> "$GITHUB_ENV"
          if [ "${{ matrix.mode }}" = proxy ]; then
            echo "REMOTE_SERVER=https://$host_ip" >> "$GITHUB_ENV"
          else
            echo "REMOTE_SERVER=https://$host_ip:8443" >> "$GITHUB_ENV"
          fi

      # compose.yaml alone, with no .env, is refused before anything starts, and the refusal says what
      # to set, since the operator token is the one setting with no default.
      - name: Refuse to start with no operator token
        if: matrix.mode == 'none'
        run: |
          mkdir -p "$RUNNER_TEMP/no-token" && cp single-host/compose.yaml "$RUNNER_TEMP/no-token/"
          cd "$RUNNER_TEMP/no-token"
          if docker compose up -d 2>"$RUNNER_TEMP/err"; then echo "docker compose up started with no operator token" >&2; exit 1; fi
          cat "$RUNNER_TEMP/err"
          grep -q 'set AGENTIIK_OPERATOR_TOKEN in .env' "$RUNNER_TEMP/err"
          [ -z "$(docker ps --all --quiet)" ]

      # A program of the host on NATS's monitoring port, which v0.2.4 took on the host's network and
      # could not start beside: the bus now publishes its bus port alone, so the README runs with it held.
      - name: Hold port 8222 on the host
        if: matrix.mode == 'none'
        run: |
          python3 -m http.server 8222 --bind 127.0.0.1 >/dev/null 2>&1 &
          for _ in $(seq 30); do curl -fs -o /dev/null http://127.0.0.1:8222/ && break; sleep 1; done
          curl -fs -o /dev/null http://127.0.0.1:8222/

      # The other machine of "Add a runner on another machine": a Docker daemon of its own, in a
      # container on the default bridge, which reaches this machine's address and not its loopback.
      # It has what the README asks of a Linux machine, and this checkout at the same path, where the
      # README's downloads are read from.
      - name: Start another machine
        if: matrix.mode != 'none'
        run: |
          docker run --detach --privileged --name machine2 docker:29-dind
          for _ in $(seq 60); do docker exec machine2 docker version >/dev/null 2>&1 && break; sleep 1; done
          docker exec machine2 apk add --no-cache --quiet bash sudo coreutils curl
          docker exec machine2 docker compose version
          docker exec machine2 mkdir -p "$GITHUB_WORKSPACE" /root/agentiik-runner
          docker cp "$GITHUB_WORKSPACE/." "machine2:$GITHUB_WORKSPACE"

      - name: Extract the README's commands
        env:
          MODE: ${{ matrix.mode }}
        run: |
          # A block for the other machine runs there, after what the README has the user carry
          # over by hand: the certificates in trust/, the address and the join token.
          awk -v mode="$MODE" '
            /^<!-- ci -->$/ { take = 1; next }
            /^<!-- ci: other machine -->$/ { take = (mode != "none"); other = 1; next }
            /^<!-- ci: browser -->$/ { take = 0; next }
            /^<!-- ci: check [a-z-]+ -->$/ {
              print ". \"$GITHUB_WORKSPACE/.github/single-host/" $4 ".sh\""
              next
            }
            /^<!-- ci: [a-z ]+ -->$/ { take = index($0, " " mode " ") > 0; next }
            /^```/ && (take || inside) {
              if (!inside) {
                inside = 1
                if (other) {
                  print "for pem in trust/*.pem; do docker cp \"$pem\" machine2:/root/agentiik-runner/; done"
                  print "docker exec -i -e JOIN_TOKEN=\"$JOIN_TOKEN\" -e AGENTIIK_SERVER=\"$REMOTE_SERVER\" ${AGENTIIK_VERSION:+-e AGENTIIK_VERSION=\"$AGENTIIK_VERSION\"} -w /root/agentiik-runner machine2 bash -veuo pipefail <<'\''OTHER_MACHINE'\''"
                }
              } else {
                if (other) print "OTHER_MACHINE"
                inside = 0; take = 0; other = 0; print ""
              }
              next
            }
            /^```/ { other = 0 }
            inside { print }
          ' single-host/README.md > "$RUNNER_TEMP/readme.sh"
          # The README downloads each file from its release tag; the test reads them from this
          # checkout instead, which is what that tag will hold.
          sed -i "s|https://raw\.githubusercontent\.com/agentiik/deploy/[^/]*/|file://$GITHUB_WORKSPACE/|g" "$RUNNER_TEMP/readme.sh"
          # With the images of main, agk from main, whichever release the README names.
          if [ -n "${UNPUBLISHED:-}" ]; then
            sed -i "s|cmd/agk@v[0-9][0-9.]*|cmd/agk@main|" "$RUNNER_TEMP/readme.sh"
          fi
          # The name a user gives the installation, here the address this machine and the other one reach.
          sed -i "s|agentiik\.example\.com|$HOST_IP|g" "$RUNNER_TEMP/readme.sh"
          cat "$RUNNER_TEMP/readme.sh"
          # As a person pastes it: a cd that fails, a file sourced from elsewhere and an export of
          # a command's output are the README's idiom, and set -e stops the run on either first.
          shellcheck --shell=bash --exclude=SC2164,SC1091,SC2155 "$RUNNER_TEMP/readme.sh"

      # -v prints each line as it is read, before expansion, so the token written in .env is never shown.
      - name: Run the README
        run: cd ~ && bash -veuo pipefail "$RUNNER_TEMP/readme.sh"

      - name: Logs of what failed
        if: failure()
        run: |
          docker compose -p agentiik ps --all || true
          docker compose -p agentiik logs --no-color --tail 200 || true
          docker exec machine2 docker compose -p agentiik-runner logs --no-color --tail 200 || true
          docker logs caddy || true

  # Upgrading a deployment is replacing compose.yaml and editing .env, then docker compose pull and up: nothing else, no file moved, no volume migrated, no command run by hand. The job installs a deployment as a person did, runs a two-step workflow on it, upgrades it that way to this checkout's compose.yaml, and checks that the operator token is still accepted, the earlier run still reads as it did with its outputs and its artifact, a runner is ready, and the same workflow runs again. release starts from the latest release of this repository, as its README installed it; latest-to-dev from that release's compose.yaml following latest, to this one following dev, since latest is what that compose.yaml was released with. Where the upgrade moves PostgreSQL to a new major version, the job checks that it runs it and that the previous cluster is kept beside it. A release whose layout this compose.yaml cannot start on fails the job, which is what it is for.
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [release, latest-to-dev]
    name: upgrade (${{ matrix.variant }})
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false

      - name: Git identity
        run: |
          git config --global user.name "Upgrade test"
          git config --global user.email "upgrade@agentiik.invalid"

      # What the deployment runs before and after. The images this checkout's compose.yaml names by default, where they are published, and otherwise the images of main, tagged dev, set in the environment of the upgrade alone as the readme job does, since a person upgrading to a release changes compose.yaml and nothing in .env. Following latest and dev is AGENTIIK_VERSION in .env, which is what such a person edits.
      - name: Choose what to upgrade from and to
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          . .github/single-host/published.sh
          to=$(default_version single-host/compose.yaml)
          from=$(git ls-remote --tags --refs https://github.com/agentiik/deploy.git | sed 's|.*refs/tags/||' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [ -z "$from" ]; then echo "agentiik/deploy has no release tag vX.Y.Z to upgrade from" >&2; exit 1; fi
          curl -fsSL -o "$RUNNER_TEMP/from-compose.yaml" "https://raw.githubusercontent.com/agentiik/deploy/$from/single-host/compose.yaml"
          case $VARIANT in
          release)
            from_images=$(default_version "$RUNNER_TEMP/from-compose.yaml")
            {
              echo "FROM_LABEL=release $from, running $from_images"
              echo "FROM_IMAGES=$from_images"
              echo "FROM_AGK=$from_images"
              echo "FROM_ENV_VERSION="
              echo "TO_ENV_VERSION="
            } >> "$GITHUB_ENV"
            if published "$to"; then
              echo "Upgrading $from to this checkout, running $to as published"
              { echo "TO_IMAGES=$to"; echo "TO_AGK=$to"; echo "TO_SHELL_VERSION="; } >> "$GITHUB_ENV"
            else
              echo "Upgrading $from to this checkout, whose $to is not published yet: running the dev images of main"
              { echo "TO_IMAGES=dev"; echo "TO_AGK=main"; echo "TO_SHELL_VERSION=dev"; } >> "$GITHUB_ENV"
            fi
            ;;
          latest-to-dev)
            echo "Upgrading $from's compose.yaml following latest to this checkout following dev"
            {
              echo "FROM_LABEL=$from's compose.yaml following latest"
              echo "FROM_IMAGES=latest"
              echo "FROM_AGK=latest"
              echo "FROM_ENV_VERSION=latest"
              echo "TO_IMAGES=dev"
              echo "TO_AGK=main"
              echo "TO_ENV_VERSION=dev"
              echo "TO_SHELL_VERSION="
            } >> "$GITHUB_ENV"
            ;;
          esac
          {
            echo "AGENTIIK_SERVER=https://localhost:8443"
            echo "SSL_CERT_DIR=$HOME/agentiik/trust"
            echo "CURL_CA_BUNDLE=$HOME/agentiik/trust/agentiik.pem"
          } >> "$GITHUB_ENV"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # As the README of that release has it: compose.yaml, a .env with the operator token, docker compose up, and agk of the same version trusting the certificate init made.
      - name: Install the deployment to upgrade
        run: |
          . .github/single-host/upgrade.sh
          mkdir -p "$installation" && cp "$RUNNER_TEMP/from-compose.yaml" "$installation/compose.yaml"
          cd "$installation"
          echo "AGENTIIK_OPERATOR_TOKEN=$(openssl rand -hex 32)" > .env
          if [ -n "$FROM_ENV_VERSION" ]; then echo "AGENTIIK_VERSION=$FROM_ENV_VERSION" >> .env; fi
          docker compose up -d --wait
          images_are "$FROM_IMAGES"
          sudo cat data/postgres/PG_VERSION > "$state/postgres-before"
          go install "github.com/agentiik/agentiik/cmd/agk@$FROM_AGK"
          mkdir -p trust
          docker compose cp api:/agentiik/trust/agentiik.pem trust/
          cp trust/agentiik.pem "$state/agentiik.pem"
          grep -v '^AGENTIIK_VERSION=' .env | sha256sum > "$state/env.sha256"

      # Two steps, the second reading what the first published, and an artifact, so that the run has outputs and a file to read back after the upgrade.
      - name: Run a workflow before the upgrade
        run: |
          . .github/single-host/upgrade.sh
          AGENTIIK_TOKEN=$(token) && export AGENTIIK_TOKEN
          mkdir -p ~/upgrade-run && cd ~/upgrade-run && git init -q
          cat > agentiik.yaml <<'EOF'
          apiVersion: agentiik.dev/v1
          kind: Workflow
          metadata:
            name: upgrade-run
            namespace: demo
          outputs:
            greeting:
              from: { step: greet, port: out }
              retain: 7d
            shout:
              from: { step: shout, port: out }
              retain: 7d
          steps:
            greet:
              image: alpine:3.21
              script:
                - echo "hello from ${AGK_STEP}"
                - echo "a file from ${AGK_STEP}" > /agk/out/files/greeting.txt
              outputs: [out]
            shout:
              image: alpine:3.21
              needs:
                - { step: greet, port: out, as: in }
              script:
                - test -s /agk/in/in/envelope.json
                - echo "${AGK_STEP} read $(wc -c < /agk/in/in/envelope.json) bytes from greet"
              outputs: [out]
          EOF
          git add agentiik.yaml && git commit -qm "A workflow run before an upgrade"
          run=$(run_workflow before "before the upgrade")
          if [ -z "$run" ]; then fail "agk run printed no run identifier before the upgrade"; fi
          echo "$run" > "$state/run"
          snapshot "$run" before "before the upgrade"
          ready_runners 0 > "$state/runners-before" || fail "no runner is ready before the upgrade"
          echo "Run $run succeeded on $(cut -d' ' -f1 "$state/runners-before" | paste -sd, -)"

      # What a person does: the new compose.yaml in place of the old one, AGENTIIK_VERSION edited in .env where they follow a channel, then pull and up. agk is upgraded the way it was installed.
      - name: Upgrade with compose.yaml and .env alone
        run: |
          . .github/single-host/upgrade.sh
          cd "$installation"
          cp "$GITHUB_WORKSPACE/single-host/compose.yaml" compose.yaml
          if [ -n "$TO_ENV_VERSION" ]; then sed -i "s/^AGENTIIK_VERSION=.*/AGENTIIK_VERSION=$TO_ENV_VERSION/" .env; fi
          if [ -n "$TO_SHELL_VERSION" ]; then export AGENTIIK_VERSION=$TO_SHELL_VERSION; fi
          docker compose pull || fail "docker compose pull failed"
          docker compose up -d --wait || fail "docker compose up -d --wait did not bring the installation up on the new compose.yaml, as its output above says"
          date -u +%s > "$state/upgraded-at"
          docker compose ps --all
          images_are "$TO_IMAGES"
          go install "github.com/agentiik/agentiik/cmd/agk@$TO_AGK"

      - name: Check what the upgrade kept
        run: |
          . .github/single-host/upgrade.sh
          cd "$installation"
          AGENTIIK_TOKEN=$(token) && export AGENTIIK_TOKEN
          run=$(cat "$state/run")

          if [ "$(grep -v '^AGENTIIK_VERSION=' .env | sha256sum)" != "$(cat "$state/env.sha256")" ]; then
            fail ".env changed beyond AGENTIIK_VERSION during the upgrade, which the test does not do: something rewrote it"
          fi

          docker compose cp api:/agentiik/trust/agentiik.pem "$state/agentiik-after.pem" || fail "the API's certificate could not be read after the upgrade"
          if ! cmp -s "$state/agentiik.pem" "$state/agentiik-after.pem"; then
            fail "init issued a new certificate, which agk and every runner trusted in its place: each would have to be handed the new one by hand"
          fi

          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $AGENTIIK_TOKEN" "$AGENTIIK_SERVER/api/v1/runner-pools")
          if [ "$status" != 200 ]; then fail "the operator token in .env was answered $status after the upgrade, where it was accepted before"; fi

          snapshot "$run" after "after the upgrade"
          for file in run.json output-greeting output-shout greeting.txt; do
            if ! diff -u "$state/before/$file" "$state/after/$file"; then
              fail "run $run reads otherwise after the upgrade: $file differs, as the diff above shows"
            fi
          done
          echo "Run $run reads as it did, with its outputs and its artifact"

          ready=$(ready_runners "$(cat "$state/upgraded-at")") || fail "no runner reported ready at a heartbeat within three minutes of the upgrade"
          while read -r runner version; do
            if grep -q "^$runner " "$state/runners-before"; then
              echo "Runner $runner is ready, the same as before the upgrade, now at $version"
            else
              echo "Runner $runner is ready, joined anew since the upgrade, at $version"
            fi
          done <<< "$ready"

          # PostgreSQL on the major version this compose.yaml runs, and where the upgrade moved it there, the previous cluster kept beside it, the way back.
          want=$(sed -n 's/^ *image: postgres:\([0-9]*\)-alpine$/\1/p' compose.yaml)
          before=$(cat "$state/postgres-before")
          now=$(sudo cat data/postgres/PG_VERSION)
          if [ "$now" != "$want" ]; then fail "data/postgres holds a cluster of PostgreSQL $now after the upgrade, where compose.yaml runs $want"; fi
          server=$(docker compose exec -T postgres psql -XAt -U postgres -c 'show server_version_num') || fail "PostgreSQL could not be asked its version after the upgrade"
          if [ "$((server / 10000))" != "$want" ]; then fail "PostgreSQL answers as $server after the upgrade, where compose.yaml runs $want"; fi
          upgrader=$(docker compose ps --all --format '{{.Image}} {{.State}} {{.ExitCode}}' postgres-upgrade)
          if [ "$upgrader" != "ghcr.io/agentiik/postgres-upgrade:$TO_IMAGES exited 0" ]; then fail "postgres-upgrade is $upgrader, where ghcr.io/agentiik/postgres-upgrade:$TO_IMAGES exited 0 was expected"; fi
          if [ "$before" != "$want" ]; then
            if [ "$(sudo cat "data/postgres-$before/PG_VERSION" 2>/dev/null)" != "$before" ]; then
              fail "the PostgreSQL $before cluster is not kept as data/postgres-$before after the upgrade to $want"
            fi
            echo "PostgreSQL $before was upgraded to $want, and its cluster is kept as data/postgres-$before"
          else
            kept=$(sudo find data -maxdepth 1 -name 'postgres-*')
            if [ -n "$kept" ]; then fail "PostgreSQL stayed on $want, and yet $kept is beside data/postgres"; fi
            echo "PostgreSQL stayed on $want"
          fi

          again=$(run_workflow after "after the upgrade")
          if [ -z "$again" ]; then fail "agk run printed no run identifier after the upgrade"; fi
          snapshot "$again" again "after the upgrade"
          echo "Run $again of the same workflow succeeded after the upgrade"

      - name: Logs of what failed
        if: failure()
        run: |
          docker compose -p agentiik ps --all || true
          docker compose -p agentiik logs --no-color --tail 200 || true

  # Each file in single-host/proxy/, run as its comments say in front of a stand-in for the API,
  # which checks what the API asks of a proxy: %2F passed undecoded, a log stream not buffered, and
  # an upload over nginx's default size. The README job runs Caddy in front of the real API.
  proxies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start the stand-in for the API
        run: |
          python3 .github/proxy/backend.py serve > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8443/ >/dev/null && break; sleep 1; done

      # Where each proxy's file names agentiik.example.com and the certificate a user obtains, the
      # test gives localhost and a certificate it makes; nothing else of each file changes.
      - name: Make a certificate for localhost
        run: |
          mkdir -p "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost -keyout "$RUNNER_TEMP/certs/privkey.pem" -out "$RUNNER_TEMP/certs/fullchain.pem" 2>/dev/null

      - name: Caddy
        run: |
          docker run --detach --name proxy --network host -e AGENTIIK_PROXY_URL=https://localhost \
            -v "$PWD/single-host/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2
          for _ in $(seq 30); do curl -ksf https://localhost/ >/dev/null && break; sleep 1; done
          python3 .github/proxy/backend.py check https://localhost
          docker rm --force proxy

      - name: nginx
        run: |
          sed 's|agentiik\.example\.com|localhost|g; s|/etc/letsencrypt/live/localhost/|/certs/|' single-host/proxy/nginx.conf > "$RUNNER_TEMP/nginx.conf"
          docker run --detach --name proxy --network host -v "$RUNNER_TEMP/certs:/certs:ro" \
            -v "$RUNNER_TEMP/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable
          for _ in $(seq 30); do curl -ksf https://localhost/ >/dev/null && break; sleep 1; done
          python3 .github/proxy/backend.py check https://localhost
          docker rm --force proxy

      - name: Traefik
        run: |
          mkdir -p "$RUNNER_TEMP/traefik"
          cp single-host/proxy/traefik.yaml "$RUNNER_TEMP/traefik/traefik.yaml"
          sed 's|agentiik\.example\.com|localhost|g; s|certResolver: letsencrypt|options: default|' single-host/proxy/traefik-agentiik.yaml > "$RUNNER_TEMP/traefik/traefik-agentiik.yaml"
          docker run --detach --name proxy --network host -v "$RUNNER_TEMP/traefik:/etc/traefik" traefik:v3
          for _ in $(seq 30); do curl -ksf https://localhost/ >/dev/null && break; sleep 1; done
          python3 .github/proxy/backend.py check https://localhost
          docker rm --force proxy

      - name: Logs of what failed
        if: failure()
        run: |
          docker logs proxy || true
          cat "$RUNNER_TEMP/backend.log" || true
