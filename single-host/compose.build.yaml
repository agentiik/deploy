# Builds the three images from the agentiik source instead of pulling them from ghcr.io, for a
# version that is not published, a branch, or a host that does not pull from ghcr.io. Enable it with
# COMPOSE_FILE=compose.yaml:compose.build.yaml in .env; AGENTIIK_VERSION is then any tag or branch
# of github.com/agentiik/agentiik, and setup builds before it starts anything.
x-build: &build
  context: .
  dockerfile: source.Dockerfile
  args:
    AGENTIIK_VERSION: ${AGENTIIK_VERSION}

services:
  api:
    build: { <<: *build, target: api }
  controller:
    build: { <<: *build, target: controller }
  runner:
    build: { <<: *build, target: runner }
