# nginx in front of the single-host installation: a server block for /etc/nginx/conf.d/, with the
# name AGENTIIK_PROXY_URL names and a certificate for it, from certbot for example.

# The web console's live connection, GET /api/v1/me/live, is a WebSocket: its request asks for the
# connection to be upgraded, and Upgrade and Connection are hop-by-hop headers nginx drops unless
# told to set them again. A request asking for no upgrade keeps the Connection: close nginx sends
# by default. Named for this file, so that it meets no map of the same name elsewhere in conf.d.
map $http_upgrade $agentiik_connection {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agentiik.example.com;
    ssl_certificate /etc/letsencrypt/live/agentiik.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agentiik.example.com/privkey.pem;

    # A push is up to 16 MiB and an artifact a runner uploads up to 5 GiB: no limit here, since
    # the API holds each route to its own. nginx's default is 1 MiB.
    client_max_body_size 0;

    location / {
        # No path after the address, so nginx passes the path as the client sent it: an artifact's
        # URI is one segment with its slashes as %2F, which a decoded path would split.
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;

        # The API counts sign-in attempts per client address, the last X-Forwarded-For entry. Set
        # from the connection alone, so that a client's own header never names somebody else.
        proxy_set_header X-Forwarded-For $remote_addr;

        # The live connection's upgrade, passed on as the map above says.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agentiik_connection;

        # A step's log stream (server-sent events) goes out as it is written. The API also says
        # so with X-Accel-Buffering: no; uploads stream to the API rather than to a temporary file.
        proxy_buffering off;
        proxy_request_buffering off;

        # An artifact has an hour to download, a log stream lasts as long as its step, with a comment
        # every 15 seconds in between, and the live connection as long as the console is open, with a
        # ping every 15 seconds. nginx's default is 60 seconds.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
